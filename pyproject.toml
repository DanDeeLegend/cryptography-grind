[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab"
version = "0.1.0"
description = "Applied cryptography lab: from-scratch implementations, attacks and benchmarks, with tests"
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.20", "cryptography>=42", "pillow>=10", "numpy>=1.26", "argon2-cffi>=23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
